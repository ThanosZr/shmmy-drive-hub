name: Publish Drive

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Αριθμός issue προσθήκης Drive
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-drive
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (!github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/publish') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
      commit_sha: ${{ steps.publish.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Approve and save Drive
        id: publish
        uses: actions/github-script@v9
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { publishDrive } = await import(pathToFileURL(process.env.GITHUB_WORKSPACE + '/scripts/publish-drive.mjs').href);
            const result = await publishDrive({ github, context, core });
            core.setOutput('changed', String(result.changed));
            core.setOutput('commit_sha', result.commitSha || '');

  deploy:
    needs: publish
    if: needs.publish.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      source_ref: ${{ needs.publish.outputs.commit_sha }}
